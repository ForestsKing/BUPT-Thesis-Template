%% 独创性\kern-0.25em（或创新性）\kern-0.25em声明与授权使用说明（严格对齐2025年1月15日规范）
\def\BUPT@label@innovationtitle{独创性（或创新性）声明}
\def\BUPT@label@innovationparagraph{%
本人声明所呈交的论文是本人在导师指导下进行的研究工作及取得的研究成果。尽我所知，除了文中特别加以标注和致谢中所罗列的内容以外，论文中不包含其他人已经发表或撰写过的研究成果，也不包含为获得北京邮电大学或其他教育机构的学位或证书而使用过的材料。与我一同工作的同志对本研究所做的任何贡献均已在论文中作了明确的说明并表示了谢意。%
\par%
申请学位论文与资料若有不实之处，本人承担一切相关责任。%
}

\def\BUPT@label@authorizationtitle{关于论文使用授权的说明}
\def\BUPT@label@authorizationparagraph{%
本人完全了解并同意北京邮电大学有关保留、使用学位论文的规定，即：北京邮电大学拥有以下关于学位论文的无偿使用权，具体包括：学校有权保留并向国家有关部门或机构送交学位论文，有权允许学位论文被查阅和借阅；学校可以公布学位论文的全部或部分内容，有权允许采用影印、缩印或其它复制手段保存、汇编学位论文，将学位论文的全部或部分内容编入有关数据库进行检索。（保密的学位论文在解密后遵守此规定）%
}

