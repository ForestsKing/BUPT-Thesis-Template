%% 中文粗体沿用模板字库，描边宽度约为字号的 2.86%。
\IfFontExistsTF{STSongti-SC-Regular}{%
  \BUPT@CJKfont{buptthesissong}{SimSun}{SimSun.ttf}{AutoFakeBold=2.86}{STSongti-SC-Regular}%
  \BUPT@CJKfont{buptthesishei}{SimHei}{SimHei.ttf}{AutoFakeBold=2.86}{STHeiti}%
}{%
  \BUPT@CJKfont{buptthesissong}{SimSun}{SimSun.ttf}{AutoFakeBold=2.86}{FandolSong-Regular.otf}%
  \BUPT@CJKfont{buptthesishei}{SimHei}{SimHei.ttf}{AutoFakeBold=2.86}{FandolHei-Regular.otf}%
}
